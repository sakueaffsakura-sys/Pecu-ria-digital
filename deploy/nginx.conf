# Pecuária Digital — site do Nginx. O instalar.sh troca __DOMINIO__, __PASTA__ e __PHP_SOCK__.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;

    root __PASTA__/public;
    index index.php;

    client_max_body_size 4m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/csv;

    # Arquivos escondidos (.git, .env...) nunca são entregues.
    location ~ /\. { deny all; return 404; }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Só o index.php é executado; qualquer outro .php dá 404.
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass unix:__PHP_SOCK__;
        fastcgi_read_timeout 60s;
    }
    location ~ \.php$ { return 404; }

    # Limite de pedidos por endereço (proteção contra abuso; o AntiDDoS da hospedagem cuida dos ataques grandes).
    limit_req zone=pecuaria burst=40 nodelay;
}
